<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #fff;
      }
      #log {
        background: #000;
        padding: 10px;
        height: 300px;
        overflow-y: scroll;
        border: 1px solid #333;
      }
      .status-on {
        color: #00ff00;
      }
      .status-off {
        color: #ff0000;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>WebSocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting ...</p>
    <form id="message-form">
      <input
        id="message-input"
        type="text"
        placeholder="Send Cargo ..."
        required
      />
      <button type="submit">Deploy Message</button>
    </form>
    <h3>Live Stream Logs</h3>
    <pre id="log"></pre>
  </body>
  <script>
    const statusElement = document.getElementById("status");
    const logElement = document.getElementById("log");
    const messageInput = document.getElementById("message-input");
    const messageForm = document.getElementById("message-form");

    const socket = new WebSocket("ws://localhost:8080");

    const appendLog = (label, message) => {
      const entry = `${new Date().toLocaleDateString()} ${label} ${message}\n`;
      logElement.textContent = entry + logElement.textContent;
    };

    socket.addEventListener("open", () => {
      statusElement.textContent = "CONNECTED: ws://localhost:8080";
      statusElement.className = "status-on";
      appendLog("[SYSTEM]", "Tunnel Established");
    });

    socket.addEventListener("close", () => {
      statusElement.textContent = "DISCONNECTED";
      statusElement.className = "status-off";
      appendLog("[SYSTEM]", "Tunnel Collapsed");
    });

    socket.addEventListener("message", (e) => {
      appendLog("[RECEIVED]", e.data);
    });

    messageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (socket.readyState !== WebSocket.OPEN) {
        appendLog("[ERROR]", "No active tunnel found.");
        return;
      }
      const message = messageInput.value.trim();
      socket.send(message);
      appendLog("[SENT]", message);
      messageInput.value = "";
    });
  </script>
</html>
